name: QA

# Functional QA runs only when started by hand (Actions > QA > Run workflow).
# It has no pull_request or push trigger, so it never adds a check to PRs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Precheck FACTORY_API_KEY
        id: precheck
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        shell: bash
        run: |
          if [ -n "$FACTORY_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A manual run is an explicit request for QA, so a missing key fails the
          # run instead of finishing green as a skipped "pass".
          echo "has_key=false" >> "$GITHUB_OUTPUT"
          echo "::error title=QA not run::FACTORY_API_KEY missing; add the repository secret and re-run."
          echo "## QA not run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "failed: FACTORY_API_KEY missing. QA did not run." >> "$GITHUB_STEP_SUMMARY"
          mkdir -p qa-results
          printf '## QA Report\n\n:no_entry: NOT RUN - FACTORY_API_KEY missing. QA did not run, so this is not a pass.\n' > qa-results/report.md
          exit 1

      - name: Setup Go
        if: steps.precheck.outputs.has_key == 'true'
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ImageMagick
        if: steps.precheck.outputs.has_key == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Setup Node.js
        if: steps.precheck.outputs.has_key == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install test tools
        if: steps.precheck.outputs.has_key == 'true'
        run: npm install -g tuistory

      - name: Install droid CLI
        if: steps.precheck.outputs.has_key == 'true'
        run: |
          curl -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run QA
        id: qa
        if: steps.precheck.outputs.has_key == 'true'
        continue-on-error: true
        timeout-minutes: 20
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          CI: "true"
          FACTORY_DISABLE_KEYRING: "true"
        shell: bash
        run: |
          mkdir -p qa-results
          set -o pipefail
          droid exec --auto high "You are running in a non-interactive CI environment. There is NO human available. Do NOT use AskUser, do NOT wait for confirmations, do NOT pause for input. Run the qa skill. Write the final report to qa-results/report.md. Use only functional/manual QA flows; do not run unit tests, lint, typecheck, or CI validators." 2>&1 | tee qa-results/qa-output.txt

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-results
          path: qa-results/
          if-no-files-found: warn
          retention-days: 14
